# @package _global_
defaults:
  - override /train_type: noise_sig_da
  - override /model: encoder_da
  - override /data: multi

exp_project: noise_sig_domain_adaptation
exp_name: encoder_nl5_hs512_da

train_type:
  domain_adaptation_loss_k: 0.1
  label_dataset_name: mc_2020

data:
  datasets:
    - name: mc_2020
      path_to_data: /home2/ivkhar/Baikal/data/normed/baikal_2020_sig-noise_mid-eq_normed.h5
      val_subset_cut: 3
    - name: exp_data
      path_to_data: /home/plotnikovgp/baikal/Baikal-ML/pytorch_training/data/baikal_exp_filtered_norm.h5
      val_subset_cut: 10
      preprocessor: no_labels_per_hit
      DatasetType: no_labels
  weights: [0.5, 0.5]
  num_workers: 0

model:
  params:
    hidden_size: 512
    num_layers: 5
    dim_feedforward_size: 512
    n_heads: 1
    out_size: 2
    aggregate_output: false

training:
  lr: 1.0e-4
  batch_size: 256
  warmup_steps: 1000
  num_train_steps_per_validation: 250
  min_recall: 0.9

