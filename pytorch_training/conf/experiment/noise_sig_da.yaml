# @package _global_
defaults:
  - override /train_type: noise_sig_da
  - override /model: encoder
  - override /data: multi

exp_project: noise_sig_domain_adaptation
exp_name: encoder_nl5_hs512_da

train_type:
  domain_adaptation_loss_k: 0.1
  label_dataset_name: mc_2020

data:
  datasets:
    - name: mc_2020
      path_to_data: /home2/ivkhar/Baikal/data/normed/baikal_2020_sig-noise_mid-eq_normed.h5
      val_subset_cut: 3
    - name: exp_data
      path_to_data: /path/to/experimental_data.h5
      val_subset_cut: 3
      preprocessor: no_labels
      DatasetType: no_labels
  weights: [0.5, 0.5]

model:
  params:
    hidden_size: 512
    num_layers: 5
    dim_feedforward_size: 512
    n_heads: 1
    out_size: 2

training:
  lr: 1.0e-3
  batch_size: 256
  warmup_steps: 10000
  num_train_steps_per_validation: 100
  min_recall: 0.9

