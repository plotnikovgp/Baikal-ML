# @package _global_
defaults:
  - override /train_type: noise_sig_original_labels_da
  - override /model: encoder_da
  - override /data: multi

exp_project: noise_sig_experiments
exp_name: g_original_labels_da_hs128

train_type:
  domain_adaptation_loss_k: 0.1
  label_dataset_name: mc_2020

data:
  datasets:
    - name: mc_2020
      path_to_data: /home/plotnikovgp/baikal/Baikal-ML/pytorch_training/data/baikal_2020_sig-noise_mid-eq_normed.h5
      val_subset_cut: 3
    - name: exp_data
      path_to_data: /home/plotnikovgp/baikal/Baikal-ML/pytorch_training/data/baikal_exp_filtered_norm_w_model_enc_v2_fix_q.h5
      val_subset_cut: 10
      preprocessor: no_labels_per_hit
      DatasetType: no_labels
      renorm_to: /home/plotnikovgp/baikal/Baikal-ML/pytorch_training/data/baikal_2020_sig-noise_mid-eq_normed.h5
  weights: [0.5, 0.5]
  num_workers: 0

model:
  params:
    hidden_size: 128
    num_layers: 5
    dim_feedforward_size: 128
    n_heads: 1
    out_size: 2
    num_domains: 2
    domain_classifier_hidden_size: 64
    domain_classifier_layers: 2
    gradient_reversal_alpha: 1.0
    aggregate_output: false

training:
  lr: 1.0e-3
  batch_size: 128
  warmup_steps: 5000
  num_train_steps_per_validation: 100
  min_recall: 0.9
