# @package _global_
defaults:
  - override /train_type: noise_sig
  - override /model: encoder
  - override /data: single

exp_project: noise_sig_rerun
exp_name: encoder_nl5_hs512

data:
  path: /home2/ivkhar/Baikal/data/normed/baikal_2020_sig-noise_mid-eq_normed.h5
  val_subset_cut: 3

model:
  params:
    hidden_size: 512
    num_layers: 5
    dim_feedforward_size: 512
    n_heads: 1
