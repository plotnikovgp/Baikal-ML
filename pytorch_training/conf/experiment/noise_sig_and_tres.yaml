# @package _global_
defaults:
  - override /train_type: noise_sig_and_tres
  - override /model: encoder
  - override /data: single

exp_project: noise_sig_experiments
exp_name: j_noise_sig_and_tres_hs128

data:
  path: /home2/ivkhar/Baikal/data/normed/baikal_2020_sig-noise_mid-eq_normed.h5
  val_subset_cut: 3

tres_cut_for_track_hit: 10.0

model:
  params:
    hidden_size: 128
    num_layers: 5
    dim_feedforward_size: 512
    n_heads: 1
    out_size: 3

