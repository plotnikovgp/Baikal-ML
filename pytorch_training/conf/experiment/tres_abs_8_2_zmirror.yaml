# @package _global_
defaults:
  - override /train_type: tres_signal_only
  - override /model: encoder
  - override /data: single

exp_project: noise_sig_experiments
exp_name: tres_abs_8-2_zmirror_hs128

z_mirror: true

data:
  path: /home/plotnikovgp/baikal/data/baikal_mc2020_multi_split_MChits-8-2_track-caskade-nue2_normed.h5
  val_subset_cut: 3

train_type:
  predict_abs: true
  normalize_tres: true
  tres_mean: 22.8
  tres_std: 55.0

model:
  params:
    hidden_size: 128
    num_layers: 5
    dim_feedforward_size: 512
    n_heads: 1
    out_size: 1
    head_bias: true

training:
  lr: 1.0e-3
  batch_size: 128
  warmup_steps: 5000
  num_train_steps_per_validation: 500
  valid_main_metric: loss
