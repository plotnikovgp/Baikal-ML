exp_project: "tres_domain_adaptation"
exp_name: "encoder_nl5_hs128_dff128_nh1_tres_da_k02_gr01_bs128"

# Basic training parameters
train_type: "tres_domain_adaptation"
is_graph: False
batch_size: 128
accumulate_grad_steps: 2
lr: 1.0e-4
val_subset_cut: 5
num_train_steps_per_validation: 250
domain_adaptation_loss_k: 0.2
label_dataset_name: "sig_noise_2020"
dataset_weights: [0.5, 0.5]
set_tres_stats: True

# Dataset configurations (same as encoder_tres.yaml)
dataset_configs:
  -
    path_to_data: &p1 "/home2/ivkhar/Baikal/data/normed/baikal_2020_sig-noise_mid-eq_normed.h5"
    name: "sig_noise_2020"
    tres_cut: 10000.0
    val_subset_cut: 5
    data_prefilter_params:
      data_file: *p1
  -
    path_to_data: /home/plotnikovgp/baikal/Baikal-ML/pytorch_training/data/baikal_exp_filtered_norm.h5
    name: "exp_data"
    val_subset_cut: 10
    DatasetType: 'no_labels'
    preprocessor: 'no_labels_per_hit'
    data_prefilter_params:
      data_file: *p1

model_type: "encoder_domain_adaptation"
model_params:
  in_features: 5
  hidden_size: 128
  num_layers: 5
  dim_feedforward_size: 128
  n_heads: 1
  out_size: 1  # Regression output for t_res
  dropout_p: 0.0
  use_batch_norm: False
  num_domains: 2  # Two datasets: reco and mc2020
  domain_classifier_hidden_size: 128
  domain_classifier_layers: 2
  gradient_reversal_alpha: 0.1
  aggregate_output: False

# Training configuration
tres_cut: 100000.0
grad_clip_value: 1.0
warmup_steps: 1000
events_amount: 1000000

save_best_per_dataset: True
valid_main_metric: "mse"  # Use MSE for regression

