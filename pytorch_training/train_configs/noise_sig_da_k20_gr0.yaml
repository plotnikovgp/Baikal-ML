exp_project: "noise_sig_domain_adaptation"
exp_name: "encoder_nl5_hs512_dff512_nh1_noise_sig_da_k20_gr0_bs128"
dataset_weights: [0.5, 0.5]

lr: 1.0e-4
batch_size: &batch_size 128
tres_cut: 100000.0
num_train_steps_per_validation: 250
accumulate_grad_steps: 2
train_type: "noise_sig_domain_adaptation" 
is_graph: False
grad_clip_value: 1.0
warmup_steps: 1000
events_amount: 10000000

domain_adaptation_loss_k: 2.0
label_dataset_name: "sig_noise_2020" 

save_best_per_dataset: True 
valid_main_metric: "auc"  # Use AUC instead of loss for checkpoint saving

dataset_configs:
  -
    path_to_data: &p1 "/home2/ivkhar/Baikal/data/normed/baikal_2020_sig-noise_mid-eq_normed.h5"
    name: "sig_noise_2020"
    tres_cut: 10000.0
    val_subset_cut: 5
    data_prefilter_params:
      data_file: *p1
  -
    path_to_data: /home/plotnikovgp/baikal/Baikal-ML/pytorch_training/data/baikal_exp_filtered_norm.h5
    name: "exp_data"
    val_subset_cut: 10
    DatasetType: 'no_labels'
    preprocessor: 'no_labels'
    data_prefilter_params:
      data_file: *p1


model_type: "encoder_domain_adaptation"
model_params:
  in_features: 5
  hidden_size: &hidden_size 512
  num_layers: &num_layers 5
  dim_feedforward_size: &dff 512
  n_heads: &n_heads 1
  out_size: 2  # Binary classification: noise vs signal
  dropout_p: 0.
  use_batch_norm: False
  num_domains: 2  # Two datasets: labeled MC and unlabeled exp data
  domain_classifier_hidden_size: 128
  domain_classifier_layers: 2
  gradient_reversal_alpha: 0.0
  aggregate_output: False  # Per-hit classification, not per-event



