# Multi-dataset domain adaptation configuration
exp_project: "angle_reconstruction_domain_adaptation"
exp_name: "encoder_domain_adapt_mc2020_to_reco_nl5_hs512_dff512_nh1_lr1e4_bs128"
dataset_weights: [0.5, 0.5]  # Equal sampling from both datasets

# Common training parameters
batch_size: 128
lr: 0.0001
val_subset_cut: 3
num_train_steps_per_validation: 256
train_type: "angle_reconstruction_domain_adaptation"  # Use domain adaptation mode
is_graph: False
domain_adaptation_loss_k: 0.1  # Weight for the domain classification loss
label_dataset_name: "mc2020"  # Only use mc2020 dataset for angle labels

dataset_configs:
  -
    path_to_data: &p1 "/home/plotnikovgp/baikal/data/baikal_reco_reco_h8s2_norm.h5"
    name: "reco"
    tres_cut: 10000.0
    val_subset_cut: 5
    data_prefilter_params:
      data_file: *p1
      norm_Q: True

  -
    path_to_data: "/home/plotnikovgp/baikal/data/baikal_multi_0324_flat_treck-cascade_h8_s2_pureMC_normed.h5"
    name: "mc2020"
    tres_cut: 10000.0
    val_subset_cut: 30
    
# Use domain adaptation model instead of regular encoder
model_type: "encoder_domain_adaptation"
model_params:
  in_features: 5
  hidden_size: &hidden_size 512
  num_layers: &num_layers 5
  dim_feedforward_size: &dff 512
  n_heads: &n_heads 1
  out_size: 3
  dropout_p: 0.0
  use_batch_norm: False
  num_domains: 2  # Two datasets: reco and mc2020
  domain_classifier_hidden_size: 128
  domain_classifier_layers: 2

lr: 1.0e-4
batch_size: &batch_size 128
accumulate_grad_steps: 1
tres_cut: 100000.0
num_train_steps_per_validation: 250
grad_clip_value: 1.0

val_subset_cut: 30
warmup_steps: 10000
events_amount: 10000000

# Save best model per dataset to track performance on each
save_best_per_dataset: True
