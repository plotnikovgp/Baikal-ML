exp_project: "angle_reconstruction_combine_reco_mc_track_length_v1"
exp_name: "cnn_no-att_da_ga1_reco"
dataset_weights: [0.5, 0.5]

lr: 1.0e-3
batch_size: &batch_size 256
tres_cut: 100000.0
num_train_steps_per_validation: 250
accumulate_grad_steps: 2
train_type: "angle_reconstruction_domain_adaptation" 
is_graph: False
grad_clip_value: 1.0
warmup_steps: 100
events_amount: 10000000
use_mae_loss: True

domain_adaptation_loss_k: 0.2
label_dataset_name: "reco" 

from_checkpoint: "/home/plotnikovgp/Baikal-ML/pytorch_training/checkpoints/angle_reconstruction_combine_reco_mc_track_length_v1/cnn_no-att_da_ga1_reco/best_mc2020.ckpt"
val_mode: True
save_best_per_dataset: True

dataset_configs:
dataset_configs:
  -
    path_to_data: &p1 "/home/plotnikovgp/Baikal-ML/pytorch_training/data/baikal_reco_reco_h8s2_norm_tl100.h5"
    name: "reco"
    tres_cut: 10000.0
    data_prefilter_params:
      data_file: *p1
      norm_Q: True
  -
    path_to_data: &p3 "/home/plotnikovgp/Baikal-ML/pytorch_training/data/baikal_2019_nue2_tl100_norm_signal.h5"
    name: "mc2019"
    tres_cut: 10000.0
    val_subset_cut: 3
  -
    path_to_data: &p2 "/home/plotnikovgp/Baikal-ML/pytorch_training/data/baikal_mc2020_multi_split_MChits-8-2_track-caskade-nue2_normed_tl100_v2.h5"
    name: "mc2020"
    tres_cut: 10000.0
    val_subset_cut: 3
# Model configuration
model_type: "cnn_domain_adaptation"
model_params:
  in_features: 5
  hidden_size: 256
  num_layers: 5
  kernel_size: 5
  out_size: 3  # For angle reconstruction (3D vector)
  # use_dilated_convolutions: False
  aggregate_output: True
  num_domains: 2  # Two datasets: reco and mc2020
  domain_classifier_hidden_size: 128
  domain_classifier_layers: 2
  gradient_reversal_alpha: 1.0
  use_attention: False  # Use attention for angle reconstruction
  # dropout_p: 0.0
  #num_heads: 4
  # attention_layers: [1, 3]  # Apply attention after layers 1 and 3

