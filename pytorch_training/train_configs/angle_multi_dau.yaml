# val_mode: True

model_type: "encoder_domain_adaptation"
model_params:
  in_features: 5
  hidden_size: &hidden_size 512
  num_layers: &num_layers 5
  dim_feedforward_size: &dff 512
  n_heads: &n_heads 1
  out_size: 3
  dropout_p: 0.
  use_batch_norm: False
  num_domains: 2  # Two datasets: reco and mc2020
  use_cls_token: True
  return_only_cls_token: True
  domain_classifier_hidden_size: 128
  domain_classifier_layers: 2
  gradient_reversal_alpha: 0.
  uncertainty_head_hidden_size: 512
  uncertainty_head_layers: 2
  uncertainty_head_out_size: 3
  freeze_encoder: True
  freeze_predict_head: True
