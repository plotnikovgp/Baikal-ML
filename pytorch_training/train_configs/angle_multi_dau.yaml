exp_project: "angle_reconstruction_uncertainty_v2"
exp_name: "encoder_tune_reco_stack_layers_direct_angle_loss"
dataset_weights: [0.5, 0.5]
train_type: "angle_reconstruction_uncertainty" 

is_domain_adaptation: True
lr: 1.0e-3
batch_size: &batch_size 512
tres_cut: 100000.0
num_train_steps_per_validation: 100
accumulate_grad_steps: 1
is_graph: False
grad_clip_value: 1.0
warmup_steps: 1000
events_amount: 10000000
use_mae_loss: True

predict_sigma: True
nll_loss_k: 1.0
angle_loss_k: 1.0

domain_adaptation_loss_k: 0.
label_dataset_name: "reco" 

save_best_per_dataset: True 

dataset_configs:
  -
    path_to_data: &p1 "/home/plotnikovgp/Baikal-ML/pytorch_training/data/baikal_reco_reco_h8s2_norm_tl100.h5"
    name: "reco"
    tres_cut: 10000.0
    val_subset_cut: 1
    data_prefilter_params:
      data_file: *p1
      norm_Q: True
  -
    path_to_data: &p2 "/home/plotnikovgp/Baikal-ML/pytorch_training/data/baikal_mc2020_multi_split_MChits-8-2_track-caskade-nue2_normed_tl100_v2.h5"
    name: "mc2020"
    tres_cut: 10000.0
    val_subset_cut: 3

from_checkpoint: "/home/plotnikovgp/Baikal-ML/pytorch_training/checkpoints/angle_reconstruction_combine_reco_mc_track_length_v1/encoder_default_wr5_wm5_da_k0_gr0_mc2020_tune_on_reco/best_reco_save.ckpt"
